version: 1

instructions:
  project:
    description: >
      This project is a proprietary WordPress membership plugin designed to
      build robust membership websites.
    technologies:
      - PHP
      - CSS
      - SQL
      - JavaScript
      - jQuery
    database:
      - MySQL
      - MariaDB

  php:
    compatibility:
      php_version: "7.4"

    file_rules:
      copyright_notice_required: true

    naming_conventions:
      classes:
        prefix: memberium_
        style: snake_case
      functions_methods:
        prefix: elf_
        style: snake_case
      variables:
        prefix: elv_
        style: snake_case
      constants:
        prefix: ELV_
        uppercase: true

    minification_engine:
      obfuscation_prefixes:
        - elf_
        - elv_
        - ELV_

    formatting:
      indentation_spaces: 4
      brace_style:
        opening_brace: same_line
        closing_brace_alignment: statement_start
      operator_spacing: true
      control_structure_spacing: true
      array_bracket_spacing: none
      strings:
        preferred_quotes: single
        allow_double_quotes_when:
          - variable_interpolation
          - escape_sequences

    documentation:
      docblocks:
        standards:
          - PSR-5
          - PSR-19-draft
        guidance:
          - concise_descriptions
          - detailed_param_docs
          - No example snippets
          
    architecture:
      classes:
        final_by_default: true
        extensibility:
          preferred:
            - hooks
            - filters
      methods:
        visibility_required: true
        prefer_private: true
        public_required_for:
          - wordpress_hooks
          - wordpress_filters
      globals:
        avoid: true

    typing:
      type_hinting: encourage

    security:
      input:
        validate: true
        sanitize: true
        typecast_superglobals: true
      output:
        escape_using_wordpress_functions: true

    quality:
      priorities:
        - performance
        - readability

  javascript:
    naming_conventions:
      prefixes_allowed: false
      style: camelCase

    syntax:
      semicolons_required: true
      variables:
        prefer: const
        allow: let
        avoid: var

    formatting:
      indentation_spaces: 2

    documentation:
      jsdoc_required: true

    functions:
      callbacks:
        prefer_arrow_functions: true

    architecture:
      global_namespace:
        avoid_pollution: true
      encapsulation:
        allowed_patterns:
          - modules
          - closures
          - IIFE

  behavior:
    communication_style:
      avoid_apologies: true
      avoid_agreement_padding: true
      avoid_conciliatory_language: true
      tone:
        pragmatic: true
        factual: true
        avoid_hyperbole: true

  licensing:
    product: Memberium
    license: proprietary
    gpl: false